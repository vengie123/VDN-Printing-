<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VDN Printing POS</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  padding:20px;
  background-image:url("Background.png");
  background-repeat:no-repeat;
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

.container{
  max-width:1200px;
  margin:auto;
}

.header{
  margin-bottom:20px;
}

.header h1{
  color:#222;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.card h2{
  font-size:18px;
  color:#777;
  margin-bottom:10px;
}

.card p{
  font-size:28px;
  font-weight:bold;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  margin-bottom:30px;
}

.buttons button{
  padding:15px 25px;
  border:none;
  border-radius:10px;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.xerox{background:#3498db;}
.scan{background:#2ecc71;}
.id{background:#9b59b6;}
.laminate{background:#e67e22;}
.print{background:#34495e;}

.table-wrapper{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  min-width:700px;
  border-collapse:collapse;
  background:white;
}

table th,
table td{
  padding:12px;
  border-bottom:1px solid #ddd;
  white-space:nowrap;
  text-align:left;
}

table th{
  background:#f0f0f0;
}

.action-buttons{
  display:flex;
  gap:5px;
}

.delete-btn{
  background:red;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.print-btn{
  background:#3498db;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.clearAll{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:red;
  color:white;
  cursor:pointer;
}

.search-box{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  margin:15px 0;
}

.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-content{
  background:white;
  width:400px;
  padding:25px;
  border-radius:12px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:5px;
}

.form-group input,
.form-group select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
}

.total-box{
  background:#f5f5f5;
  padding:15px;
  border-radius:8px;
  margin-bottom:15px;
  font-size:20px;
  font-weight:bold;
}

.modal-buttons{
  display:flex;
  gap:10px;
}

.save-btn,
.close-btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.save-btn{
  background:#2ecc71;
}

.close-btn{
  background:#e74c3c;
}

@media(max-width:600px){

  body{
    padding:10px;
  }

  .buttons{
    flex-direction:column;
  }

  .buttons button{
    width:100%;
  }

  .modal-content{
    width:95%;
  }

  table{
    font-size:13px;
  }
}

@media print{

  body *{
    visibility:hidden;
  }

  #receiptContent,
  #receiptContent *{
    visibility:visible;
  }

  #receiptContent{
    position:absolute;
    left:0;
    top:0;
    width:100%;
  }

  .modal-buttons{
    display:none;
  }
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🖨️ VDN Printing Services</h1>
</div>

<div class="cards">

<div class="card">
<h2>Income</h2>
<p id="dailyIncome">₱0</p>
</div>

<div class="card">
<h2>Total Transactions</h2>
<p id="totalTransactions">0</p>
</div>

</div>

<div class="buttons">

<button class="print"
onclick="openPrintModal()">
Print
</button>

<button class="xerox"
onclick="openModal('Xerox')">
Xerox
</button>

<button class="scan"
onclick="openModal('Scan')">
Scan
</button>

<button class="id"
onclick="openModal('ID Picture')">
ID Picture
</button>

<button class="laminate"
onclick="openModal('Laminate')">
Laminate
</button>



</div>

<h2>Transactions</h2>

<input
type="text"
id="searchInput"
class="search-box"
placeholder="Search customer..."
>

<div class="table-wrapper">

<table>

<thead>
<tr>
<th>Date</th>
<th>Service</th>
<th>Customer</th>
<th>Qty</th>
<th>Total</th>
<th>Action</th>
</tr>
</thead>

<tbody id="transactionTable"></tbody>

</table>

</div>

<br>

<button class="clearAll"
onclick="clearTransactions()">
Clear All
</button>

</div>

<!-- MODAL -->

<div class="modal" id="transactionModal">

<div class="modal-content">

<h2 id="modalTitle">Add Transaction</h2>

<div class="form-group">
<label>Customer Name</label>
<input type="text" id="customerName">
</div>

<div class="form-group">
<label>Quantity</label>
<input type="number" id="quantity">
</div>

<!-- PRINT OPTIONS -->

<div id="printOptions" style="display:none;">



<div class="form-group">

<label>Print Type</label>

<select id="printType">
<option value="0">Black & White - ₱5</option>
<option value="5">Colored - ₱10</option>
</select>

</div>

</div>

<div class="form-group">

<label>Price</label>

<input
type="number"
id="price"
readonly
style="
background:#f0f0f0;
cursor:not-allowed;
">

</div>

<div class="total-box">
Total: ₱<span id="totalAmount">0</span>
</div>

<div class="form-group">

<label>Cash Received</label>

<input
type="number"
id="cashReceived"
placeholder="Enter cash amount"
>

</div>

<div class="total-box">
Change: ₱<span id="changeAmount">0</span>
</div>

<div class="modal-buttons">

<button class="save-btn"
onclick="saveTransaction()">
Save
</button>

<button class="close-btn"
onclick="closeModal()">
Close
</button>

</div>

</div>

</div>

<!-- RECEIPT -->

<div class="modal" id="receiptModal">

<div class="modal-content" id="receiptContent">

<h2 style="text-align:center;">
🖨️ VDN Printing Services
</h2>

<p style="text-align:center;">
Official Receipt
</p>

<hr><br>

<p>
<strong>Date:</strong>
<span id="receiptDate"></span>
</p>

<p>
<strong>Service:</strong>
<span id="receiptService"></span>
</p>

<p>
<strong>Customer:</strong>
<span id="receiptCustomer"></span>
</p>

<p>
<strong>Quantity:</strong>
<span id="receiptQty"></span>
</p>

<div id="receiptPrintDetails"
style="display:none;">


<p>
<strong>Type:</strong>
<span id="receiptType"></span>
</p>

</div>

<p>
<strong>Total:</strong>
₱<span id="receiptTotal"></span>
</p>

<p>
<strong>Cash:</strong>
₱<span id="receiptCash"></span>
</p>

<p>
<strong>Change:</strong>
₱<span id="receiptChange"></span>
</p>

<br><hr>

<p style="text-align:center;">
Thank you!
</p>

<div class="modal-buttons">

<button class="save-btn"
onclick="printReceipt()">
Print Receipt
</button>

<button class="close-btn"
onclick="closeReceipt()">
Close
</button>

</div>

</div>

</div>

<script>

let selectedService = "";

const modal =
document.getElementById("transactionModal");

const quantityInput =
document.getElementById("quantity");

const priceInput =
document.getElementById("price");

const paperSize =
document.getElementById("paperSize");

const printType =
document.getElementById("printType");

const printOptions =
document.getElementById("printOptions");

let transactions =
JSON.parse(localStorage.getItem("transactions")) || [];

loadTransactions();

document.getElementById("searchInput")
.addEventListener("input", loadTransactions);

function openModal(service){

selectedService = service;

printOptions.style.display = "none";

document.getElementById("modalTitle")
.innerText =
"Add " + service + " Transaction";

if(service === "Xerox"){
priceInput.value = 5;
}

else if(service === "Scan"){
priceInput.value = 15;
}

else if(service === "ID Picture"){
priceInput.value = 45;
}

else if(service === "Laminate"){
priceInput.value = 25;
}

computeTotal();

modal.style.display = "flex";
}

function openPrintModal(){

selectedService = "Print";

document.getElementById("modalTitle")
.innerText =
"Add Print Transaction";

printOptions.style.display = "block";

updatePrintPrice();

computeTotal();

modal.style.display = "flex";
}

function updatePrintPrice(){

const basePrice = 5;

const color =
Number(printType.value);

priceInput.value =
basePrice + color;

computeTotal();
}

function closeModal(){

modal.style.display = "none";

document.getElementById("customerName").value = "";
document.getElementById("quantity").value = "";
document.getElementById("price").value = "";
document.getElementById("cashReceived").value = "";

document.getElementById("totalAmount")
.innerText = "0";

document.getElementById("changeAmount")
.innerText = "0";
}

function computeTotal(){

const qty =
Number(quantityInput.value);

const price =
Number(priceInput.value);

const total = qty * price;

document.getElementById("totalAmount")
.innerText = total;

computeChange();
}

function computeChange(){

const total =
Number(
document.getElementById("totalAmount")
.innerText
);

const cash =
Number(
document.getElementById("cashReceived")
.value
);

const change = cash - total;

document.getElementById("changeAmount")
.innerText =
change >= 0 ? change : 0;
}

quantityInput.addEventListener(
"input",
computeTotal
);

paperSize.addEventListener(
"change",
updatePrintPrice
);

printType.addEventListener(
"change",
updatePrintPrice
);

document.getElementById("cashReceived")
.addEventListener(
"input",
computeChange
);

function saveTransaction(){

const customer =
document.getElementById("customerName")
.value || "Walk-in";

const qty =
Number(quantityInput.value);

const price =
Number(priceInput.value);

const total = qty * price;

const cash =
Number(
document.getElementById("cashReceived")
.value
);

if(qty <= 0 || price <= 0){

alert("Please enter valid values");
return;
}

if(cash < total){

alert("Insufficient cash!");
return;
}

const transaction = {

date:new Date().toLocaleString(),

service:selectedService,

customer:customer,

quantity:qty,

total:total,

cash:cash,

change:cash-total,



printType:
selectedService === "Print"
? printType.options[
printType.selectedIndex
].text
: ""
};

transactions.push(transaction);

localStorage.setItem(
"transactions",
JSON.stringify(transactions)
);

loadTransactions();

showReceipt(transaction);

closeModal();
}

function showReceipt(transaction){

document.getElementById("receiptDate")
.innerText = transaction.date;

document.getElementById("receiptService")
.innerText = transaction.service;

document.getElementById("receiptCustomer")
.innerText = transaction.customer;

document.getElementById("receiptQty")
.innerText = transaction.quantity;

document.getElementById("receiptTotal")
.innerText = transaction.total;

document.getElementById("receiptCash")
.innerText = transaction.cash;

document.getElementById("receiptChange")
.innerText = transaction.change;

if(transaction.service === "Print"){

document.getElementById(
"receiptPrintDetails"
).style.display = "block";


document.getElementById(
"receiptType"
).innerText =
transaction.printType;
}

else{

document.getElementById(
"receiptPrintDetails"
).style.display = "none";
}

document.getElementById("receiptModal")
.style.display = "flex";
}

function closeReceipt(){

document.getElementById("receiptModal")
.style.display = "none";
}

function printReceipt(){

window.print();
}

function reprintReceipt(index){

showReceipt(transactions[index]);
}

function loadTransactions(){

const table =
document.getElementById("transactionTable");

table.innerHTML = "";

let dailyIncome = 0;

const search =
document.getElementById("searchInput")
.value
.toLowerCase();

transactions.forEach((transaction,index)=>{

if(
!transaction.customer
.toLowerCase()
.includes(search)
){
return;
}

const today =
new Date().toLocaleDateString();

const transDate =
new Date(transaction.date)
.toLocaleDateString();

if(today === transDate){
dailyIncome += transaction.total;
}

const row = `

<tr>

<td>${transaction.date}</td>

<td>${transaction.service}</td>

<td>${transaction.customer}</td>

<td>${transaction.quantity}</td>

<td>₱${transaction.total}</td>

<td>

<div class="action-buttons">

<button
class="print-btn"
onclick="reprintReceipt(${index})">
Print
</button>

<button
class="delete-btn"
onclick="deleteTransaction(${index})">
Delete
</button>

</div>

</td>

</tr>

`;

table.innerHTML += row;

});

document.getElementById("dailyIncome")
.innerText = "₱" + dailyIncome;

document.getElementById("totalTransactions")
.innerText = transactions.length;
}

function deleteTransaction(index){

if(confirm("Delete this transaction?")){

transactions.splice(index,1);

localStorage.setItem(
"transactions",
JSON.stringify(transactions)
);

loadTransactions();
}
}

function clearTransactions(){

if(confirm("Delete all transactions?")){

localStorage.removeItem("transactions");

transactions = [];

loadTransactions();
}
}

document.addEventListener("keydown",function(e){

if(e.key === "Escape"){

closeModal();

closeReceipt();
}
});

</script>

</body>
</html>
