
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VDN Printing</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      padding:20px;
      background-image:url("Background.png");
      background-repeat:no-repeat;
      background-size:cover;
      background-position:center;
      background-attachment:fixed;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    .header{
      margin-bottom:20px;
    }

    .header h1{
      color:#222;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
      gap:20px;
      margin-bottom:30px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card h2{
      font-size:18px;
      color:#777;
      margin-bottom:10px;
    }

    .card p{
      font-size:28px;
      font-weight:bold;
      color:#111;
    }

    .actions{
      margin-bottom:30px;
    }

    .actions h2{
      margin-bottom:15px;
    }

    .buttons{
      display:flex;
      flex-wrap:wrap;
      gap:15px;
    }

    .buttons button{
      padding:15px 25px;
      border:none;
      border-radius:10px;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.2s;
    }

    .buttons button:hover{
      opacity:0.85;
      transform:scale(1.03);
    }

    .clearAll{
      padding:8px 15px;
      border:none;
      border-radius:10px;
      color:white;
      font-size:13px;
      cursor:pointer;
      background:red;
    }

    .xerox{ background:#3498db; }
    .scan{ background:#2ecc71; }
    .id{ background:#9b59b6; }
    .laminate{ background:#e67e22; }

    /* RESPONSIVE TABLE */

.table-wrapper{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  border-radius:10px;
}

table{
  width:100%;
  min-width:700px;
  border-collapse:collapse;
  margin-top:15px;
  background:white;
}

table th,
table td{
  white-space:nowrap;
}

.action-buttons{
  display:flex;
  gap:5px;
  flex-wrap:nowrap;
}

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
    }

    table th,
    table td{
      padding:12px;
      border-bottom:1px solid #ddd;
      text-align:left;
    }

    table th{
      background:#f0f0f0;
    }

    .delete-btn{
      background:red;
      color:white;
      border:none;
      padding:6px 12px;
      border-radius:6px;
      cursor:pointer;
    }

    .print-btn{
      background:#3498db;
      color:white;
      border:none;
      padding:6px 12px;
      border-radius:6px;
      cursor:pointer;
    }

    .search-box{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      margin-top:15px;
      margin-bottom:15px;
    }

    /* MODAL */

    .modal{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.5);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:999;
    }

    .modal-content{
      background:white;
      width:400px;
      padding:25px;
      border-radius:12px;
    }

    .modal-content h2{
      margin-bottom:20px;
    }

    .form-group{
      margin-bottom:15px;
    }

    .form-group label{
      display:block;
      margin-bottom:5px;
      color:#555;
    }

    .form-group input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
    }

    .total-box{
      background:#f5f5f5;
      padding:15px;
      border-radius:8px;
      margin-bottom:15px;
      font-size:20px;
      font-weight:bold;
    }

    .modal-buttons{
      display:flex;
      gap:10px;
    }

    .save-btn{
      flex:1;
      background:#2ecc71;
      color:white;
      border:none;
      padding:12px;
      border-radius:8px;
      cursor:pointer;
    }

    .close-btn{
      flex:1;
      background:#e74c3c;
      color:white;
      border:none;
      padding:12px;
      border-radius:8px;
      cursor:pointer;
    }

    @media print {

      body *{
        visibility:hidden;
      }

      #receiptContent,
      #receiptContent *{
        visibility:visible;
      }

      #receiptContent{
        position:absolute;
        left:0;
        top:0;
        width:100%;
      }

      .modal-buttons{
        display:none;
      }
    }

    @media(max-width:600px){

  body{
    padding:10px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .card{
    padding:15px;
  }

  .buttons{
    flex-direction:column;
  }

  .buttons button{
    width:100%;
  }

  .modal-content{
    width:95%;
    padding:18px;
  }

  .table-section{
    padding:10px;
  }

  table{
    font-size:13px;
  }

  table th,
  table td{
    padding:10px;
  }

  .search-box{
    font-size:14px;
  }

  .delete-btn,
  .print-btn{
    padding:5px 8px;
    font-size:11px;
  }
}

  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🖨️ VDN Printing Services</h1>
  </div>

  <!-- DASHBOARD -->

  <div class="cards">

    <div class="card">
      <h2>Income</h2>
      <p id="dailyIncome">₱0</p>
    </div>

    <div class="card">
      <h2>Total Transactions</h2>
      <p id="totalTransactions">0</p>
    </div>

  </div>

  <!-- QUICK ACTIONS -->

  <div class="actions">

    

    <div class="buttons">

      <button class="xerox"
        onclick="openModal('Xerox')">
        Xerox
      </button>

      <button class="scan"
        onclick="openModal('Scan')">
        Scan
      </button>

      <button class="id"
        onclick="openModal('ID Picture')">
        ID Picture
      </button>

      <button class="laminate"
        onclick="openModal('Laminate')">
        Laminate
      </button>

    </div>

  </div>

  <!-- TABLE -->

  <div class="table-section">

    <h2>Transactions</h2>

    <input
      type="text"
      id="searchInput"
      class="search-box"
      placeholder="Search customer..."
    >

    <div class="table-wrapper">
<table>

      <thead>

        <tr>
          <th>Date</th>
          <th>Service</th>
          <th>Customer</th>
          <th>Qty</th>
          <th>Total</th>
          <th>Action</th>
        </tr>

      </thead>

      <tbody id="transactionTable"></tbody>

    </table>
</div>

    <br>

    <button class="clearAll"
      onclick="clearTransactions()">
      Clear All
    </button>

  </div>

</div>

<!-- TRANSACTION MODAL -->

<div class="modal" id="transactionModal">

  <div class="modal-content">

    <h2 id="modalTitle">Add Transaction</h2>

    <div class="form-group">
      <label>Customer Name</label>
      <input type="text" id="customerName">
    </div>

    <div class="form-group">
      <label>Quantity</label>
      <input type="number" id="quantity">
    </div>

    <div class="form-group">
  <label>Price</label>

  <input
    type="number"
    id="price"
    readonly
    style="
      background:#f0f0f0;
      cursor:not-allowed;
    "
  >
</div>

    <div class="total-box">
      Total: ₱<span id="totalAmount">0</span>
    </div>

    <div class="modal-buttons">

      <button class="save-btn"
        onclick="saveTransaction()">
        Save
      </button>

      <button class="close-btn"
        onclick="closeModal()">
        Close
      </button>

    </div>

  </div>

</div>

<!-- RECEIPT MODAL -->

<div class="modal" id="receiptModal">

  <div class="modal-content" id="receiptContent">

    <h2 style="text-align:center;">
      🖨️ VDN Printing Services
    </h2>

    <p style="text-align:center;">
      Official Receipt
    </p>

    <p style="text-align:center; font-size:12px;">
      Purok 9, Salvacion, Panabo City
    </p>

    <hr><br>

    <p>
      <strong>Date:</strong>
      <span id="receiptDate"></span>
    </p>

    <p>
      <strong>Service:</strong>
      <span id="receiptService"></span>
    </p>

    <p>
      <strong>Customer:</strong>
      <span id="receiptCustomer"></span>
    </p>

    <p>
      <strong>Quantity:</strong>
      <span id="receiptQty"></span>
    </p>

    <p>
      <strong>Total:</strong>
      ₱<span id="receiptTotal"></span>
    </p>

    <br><hr>

    <p style="text-align:center;">
      Thank you!
    </p>

    <div class="modal-buttons">

      <button class="save-btn"
        onclick="printReceipt()">
        Print Receipt
      </button>

      <button class="close-btn"
        onclick="closeReceipt()">
        Close
      </button>

    </div>

  </div>

</div>

<script>

  let selectedService = "";

  const modal =
    document.getElementById("transactionModal");

  const quantityInput =
    document.getElementById("quantity");

  const priceInput =
    document.getElementById("price");

  // STORAGE

  let transactions =
    JSON.parse(localStorage.getItem("transactions")) || [];

  // LOAD ON START

  loadTransactions();

  // SEARCH

  document.getElementById("searchInput")
    .addEventListener("input", loadTransactions);

  // OPEN MODAL

  function openModal(service){

    selectedService = service;

    document.getElementById("modalTitle")
      .innerText =
      "Add " + service + " Transaction";

    // AUTO PRICE

    if(service === "Xerox"){
      priceInput.value = 5;
    }

    else if(service === "Scan"){
      priceInput.value = 15;
    }

    else if(service === "ID Picture"){
      priceInput.value = 45;
    }

    else if(service === "Laminate"){
      priceInput.value = 25;
    }

    computeTotal();

    modal.style.display = "flex";
  }

  // CLOSE MODAL

  function closeModal(){

    modal.style.display = "none";

    document.getElementById("customerName").value = "";
    document.getElementById("quantity").value = "";
    document.getElementById("price").value = "";

    document.getElementById("totalAmount")
      .innerText = "0";
  }

  // COMPUTE TOTAL

  function computeTotal(){

    const qty =
      Number(quantityInput.value);

    const price =
      Number(priceInput.value);

    const total = qty * price;

    document.getElementById("totalAmount")
      .innerText = total;
  }

  quantityInput.addEventListener(
    "input",
    computeTotal
  );

  priceInput.addEventListener(
    "input",
    computeTotal
  );

  // SAVE TRANSACTION

  function saveTransaction(){

    const customer =
      document.getElementById("customerName")
      .value || "Walk-in";

    const qty =
      Number(quantityInput.value);

    const price =
      Number(priceInput.value);

    const total = qty * price;

    if(qty <= 0 || price <= 0){

      alert("Please enter valid values");
      return;
    }

    const transaction = {

      date:new Date().toLocaleString(),

      service:selectedService,

      customer:customer,

      quantity:qty,

      total:total
    };

    transactions.push(transaction);

    localStorage.setItem(
      "transactions",
      JSON.stringify(transactions)
    );

    loadTransactions();

    showReceipt(transaction);

    closeModal();
  }

  // SHOW RECEIPT

  function showReceipt(transaction){

    document.getElementById("receiptDate")
      .innerText = transaction.date;

    document.getElementById("receiptService")
      .innerText = transaction.service;

    document.getElementById("receiptCustomer")
      .innerText = transaction.customer;

    document.getElementById("receiptQty")
      .innerText = transaction.quantity;

    document.getElementById("receiptTotal")
      .innerText = transaction.total;

    document.getElementById("receiptModal")
      .style.display = "flex";
  }

  // CLOSE RECEIPT

  function closeReceipt(){

    document.getElementById("receiptModal")
      .style.display = "none";
  }

  // PRINT RECEIPT

  function printReceipt(){

    window.print();
  }

  // REPRINT RECEIPT

  function reprintReceipt(index){

    const transaction = transactions[index];

    document.getElementById("receiptDate")
      .innerText = transaction.date;

    document.getElementById("receiptService")
      .innerText = transaction.service;

    document.getElementById("receiptCustomer")
      .innerText = transaction.customer;

    document.getElementById("receiptQty")
      .innerText = transaction.quantity;

    document.getElementById("receiptTotal")
      .innerText = transaction.total;

    document.getElementById("receiptModal")
      .style.display = "flex";
  }

  // LOAD TRANSACTIONS

  function loadTransactions(){

    const table =
      document.getElementById("transactionTable");

    table.innerHTML = "";

    let dailyIncome = 0;

    const search =
      document.getElementById("searchInput")
      .value
      .toLowerCase();

    transactions.forEach((transaction, index) => {

      // SEARCH FILTER

      if(
        !transaction.customer
        .toLowerCase()
        .includes(search)
      ){
        return;
      }

      // DAILY INCOME

      const today =
        new Date().toLocaleDateString();

      const transDate =
        new Date(transaction.date)
        .toLocaleDateString();

      if(today === transDate){
        dailyIncome += transaction.total;
      }

      const row = `

        <tr>

          <td>${transaction.date}</td>

          <td>${transaction.service}</td>

          <td>${transaction.customer}</td>

          <td>${transaction.quantity}</td>

          <td>₱${transaction.total}</td>

          <td>
  <div class="action-buttons">

            <button
              class="print-btn"
              onclick="reprintReceipt(${index})">

              Print

            </button>

            <button
              class="delete-btn"
              onclick="deleteTransaction(${index})">

              Delete

            </button>

            </div>
</td>

        </tr>

      `;

      table.innerHTML += row;

    });

    document.getElementById("dailyIncome")
      .innerText = "₱" + dailyIncome;

    document.getElementById("totalTransactions")
      .innerText = transactions.length;
  }

  // DELETE SINGLE

  function deleteTransaction(index){

    if(confirm("Delete this transaction?")){

      transactions.splice(index, 1);

      localStorage.setItem(
        "transactions",
        JSON.stringify(transactions)
      );

      loadTransactions();
    }
  }

  // CLEAR ALL

  function clearTransactions(){

    if(confirm("Delete all transactions?")){

      localStorage.removeItem("transactions");

      transactions = [];

      loadTransactions();
    }
  }

  // ESC KEY CLOSE

  document.addEventListener("keydown", function(e){

    if(e.key === "Escape"){

      closeModal();

      closeReceipt();
    }
  });

</script>

</body>
</html>
